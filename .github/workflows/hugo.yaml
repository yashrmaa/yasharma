# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 14 * * 1'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The build cannot deploy or mint an OIDC token.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.168.0
      HUGO_SHA256: b7cd5087c39bf5584e40180bd04fab0c6fb19f2913cd63121da8663e112a08db
    steps:
      - name: Install Hugo CLI
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          printf '%s  %s\n' "$HUGO_SHA256" "$RUNNER_TEMP/hugo.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Pages
        id: pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts
      - name: Audit build dependencies
        run: npm audit --audit-level=moderate
      - name: Check publisher security and behavior
        run: npm test --prefix tools/note-publisher
      - name: Check rendered content and existing pages
        env:
          HUGO_BIN: hugo
        run: npm run test:site --prefix tools/note-publisher
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url || 'https://yasharma.com' }}/"
      - name: Run pagefind
        run: npm run build:search
      - name: Check for a newer stable Hugo release
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/gohugoio/hugo/releases/latest --jq .tag_name)"
          if [[ "$latest" != "v$HUGO_VERSION" ]]; then
            printf '::error::Hugo %s is available. Review the release and update HUGO_VERSION and HUGO_SHA256.\n' "$latest"
            exit 1
          fi
          printf 'Hugo %s is the current stable release.\n' "$HUGO_VERSION"
      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
