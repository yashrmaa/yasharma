<article class="note-entry">
  {{ if eq .Params.kind "link" }}
  <p class="note-source"><a href="{{ .Params.source_url }}" rel="external">{{ partial "notes/label.html" . }} <span aria-hidden="true">↗</span></a><span class="note-source-label">Original source</span></p>
  {{ end }}
  {{ with .Content }}<div class="post-content note-content">{{ . }}</div>{{ end }}
  <footer class="note-meta">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    <span aria-hidden="true"> · </span><a href="{{ .RelPermalink }}">Permalink</a>
    {{ if .Draft }} · Draft{{ end }}
  </footer>
</article>
